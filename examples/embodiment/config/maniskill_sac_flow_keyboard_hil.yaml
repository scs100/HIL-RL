defaults:
  - env/maniskill_pick_cube@env.train
  - env/maniskill_pick_cube@env.eval
  - model/flow_policy@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement: 
    actor,env,rollout: 0  # 单卡运行（4090）

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "dp_hil_sac_keyboard"
    logger_backends: ["tensorboard"]
  
  max_epochs: 2000
  max_steps: -1
  
  only_eval: False
  val_check_interval: 50
  save_interval: 100

algorithm:
  update_epoch: 16
  normalize_advantages: False
  kl_penalty: kl
  group_size: 1
  agg_q: min
  
  rollout_epoch: 1
  eval_rollout_epoch: 1
  
  reward_type: action_level
  logprob_type: action_level
  entropy_type: action_level
  
  # SAC算法配置
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"
  
  bootstrap_type: always
  
  # SAC超参数
  gamma: 0.99
  tau: 0.005
  auto_entropy_tuning: True
  alpha_type: softplus
  initial_alpha: 0.2
  target_entropy: -4
  alpha_lr: 3.0e-4
  
  critic_actor_ratio: 1
  backup_entropy: True
  
  # Replay Buffer配置
  replay_buffer_capacity: 100000
  min_buffer_size: 500
  num_updates_per_step: 32
  target_update_freq: 1
  
  # Rollout参数
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  
  length_params:
    max_new_token: 7
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False
  
  train:
    total_num_envs: 16  # 并行环境数
    auto_reset: True
    ignore_terminations: True
    use_fixed_reset_state_ids: False
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 10
    
    # 🔥 启用键盘HIL
    use_keyboard_hil: True
    keyboard_intervention_window: 0.5  # 干预窗口（秒）
    
    init_params:
      obs_mode: rgb
      sensor_configs:
        width: 128
        height: 128
  
  eval:
    total_num_envs: 8
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    use_fixed_reset_state_ids: True
    group_size: 1
    
    # 评估时也可以开启键盘干预（可选）
    use_keyboard_hil: False
    
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
    
    init_params:
      obs_mode: rgb
      sensor_configs:
        width: 128
        height: 128

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  
  model:
    model_path: ""
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  
  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False
  
  model:
    model_type: "flow_policy"
    input_type: "mixed"  # 视觉+状态输入
    
    # 🔥 DP Transformer配置
    model_path: "./checkpoints"  # ResNet预训练权重目录
    
    policy_setup: "panda-ee-dpos"
    image_num: 1
    image_size: [3, 128, 128]
    state_dim: 29
    action_dim: 7  # [x,y,z,rx,ry,rz,gripper]
    num_action_chunks: 1
    hidden_dim: 256
    
    precision: "32"
    add_value_head: False
    add_q_head: True
    num_q_heads: 2
    backbone: resnet
    
    # Flow Matching配置（Diffusion Policy Transformer）
    denoising_steps: 4
    d_model: 96
    n_head: 4
    n_layers: 2
    use_batch_norm: False
    flow_actor_type: "JaxFlowTActor"
    
    # 噪声配置
    noise_std_head: True
    log_std_min_train: -5
    log_std_max_train: 2
    log_std_min_rollout: -10
    log_std_max_rollout: 0
    noise_std_train: 0.3
    noise_std_rollout: 0.02
    
    is_lora: False
    gradient_checkpointing: False
    sharding_strategy: no_shard
    vh_mode: "q_network"
    q_network_separate_processing: True
    
    encoder_config:
      ckpt_name: "resnet10_pretrained.pt"
  
  optim:
    lr: 3.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 1.0
  
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
